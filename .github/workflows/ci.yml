name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the development image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          tags: tiny-fixed-function-gpu-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run quality checks in the development image
        run: >-
          docker run --rm --user root
          --volume "${{ github.workspace }}:/workspace"
          --workdir /workspace
          tiny-fixed-function-gpu-dev
          bash -lc 'make ci'

      - name: Upload simulation traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-artifacts
          path: .sim_build/
          retention-days: 7
