[project]
name = "tiny-fixed-function-gpu"
version = "0.1.0"
description = "CDI SJSU fixed-function GPU development and verification tooling"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "cocotb==2.0.1",
    "edalize==0.6.8",
    "pytest==9.0.3",
    "pyyaml==6.0.3",
    "ruff==0.13.2",
    "vunit-hdl==4.7.1",
    "yowasp-yosys==0.68.0.0.post1208",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "tests", "tests/top", "tests/rasterizer", "tests/geometry", "tests/vga"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
respect-gitignore = false
extend-exclude = [".git", ".sim_build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
